[tool.poetry]
name = "dspace-reports"
version = "4.1.0"
description = "A Python tool to generate and email views and downloads statistical reports for a DSpace 7+ repository."
authors = ["Nicholas Woodward <njw@austin.utexas.edu>"]
license = "GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
certifi = "2026.10.23"
chardet = "7.7.0"
idna = "3.20"
isort = "9.0.2"
lazy-object-proxy = "1.13.0"
mccabe = "==0.7.0"
psycopg = "3.3.8"
pylint = "4.1.3"
python-dateutil = "4.0.0"
PyYAML = "6.0.3"
requests = "2.34.2"
six = "1.17.0"
toml = "==0.10.2"
urllib3 = "2.8.0"
wrapt = "2.5.2"
XlsxWriter = "3.3.1"
astroid = "4.3.4"
tomlkit = "0.15.2"
platformdirs = "4.14.5"
typing-extensions = "4.16.0"
dill = "0.4.1"
charset-normalizer = "3.5.2"
tzdata = "2026.6"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
